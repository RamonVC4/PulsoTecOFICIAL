<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Credenciales InnovaTec</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 40px 48px;
      max-width: 480px;
      width: 100%;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      color: #1a56db;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 32px;
    }

    h2 {
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #9ca3af;
      margin-bottom: 12px;
    }

    .account {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 18px 20px;
      margin-bottom: 16px;
    }

    .role {
      font-size: 13px;
      font-weight: 700;
      color: #1a56db;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 12px;
    }

    .field {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .field:last-child { margin-bottom: 0; }

    .field label {
      color: #6b7280;
      font-weight: 500;
      min-width: 80px;
    }

    .field span {
      color: #111827;
      font-weight: 600;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      background: #e0e7ff;
      padding: 2px 10px;
      border-radius: 5px;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">InnovaTec</div>
    <div class="subtitle">Credenciales de acceso al sistema</div>

    <h2>Cuentas</h2>

    <div class="account">
      <div class="role">Autor</div>
      <div class="field">
        <label>Correo</label>
        <span>autor.innovatec@gmail.com</span>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <span>12345678</span>
      </div>
    </div>

    <div class="account">
      <div class="role">Revisor</div>
      <div class="field">
        <label>Correo</label>
        <span>revisor.innovatec@gmail.com</span>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <span>12345678</span>
      </div>
    </div>

    <div class="footer">Documento de uso interno &mdash; InnovaTec 2026</div>
  </div>
</body>
</html>
